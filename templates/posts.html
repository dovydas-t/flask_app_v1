{% extends "base.html" %} {% block title %} SoundSwipe {% endblock %} {% block
content %}

<h1>All Posts:</h1>
<ul class="posts-list">
  {% for post in posts %}
  <li>
    <h2><a href="{{ url_for('post_detail', post_id=post.id) }}">{{ post.title }}</a></h2>
    <p>Posted by {{ post.author }} on {{ post.date_posted }}</p>
  </li>
  {% endfor %}
</ul>

{% endblock %}
